# Rate Limiting Configuration
# Membatasi permintaan yang masuk sebanyak 90 request per menit (90r/m)
# Zona memory 10MB cukup untuk menyimpan status ~160.000 IP address
limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

# HTTP Server - Redirect seluruh trafik HTTP (Port 80) ke HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect ke HTTPS untuk menghindari serangan Man-in-the-Middle (MITM)
    return 301 https://$host$request_uri;
}

# HTTPS Server - SSL/TLS Reverse Proxy ke Forum API (Port 5000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificate Configuration (Let's Encrypt / Custom SSL)
    ssl_certificate /etc/letsencrypt/live/forum-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum-api/privkey.pem;

    # SSL Protocols & Ciphers Optimization for Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Kriteria 3: Menerapkan Limit Access pada resource /threads dan path di dalamnya
    # Maksimal 90 request per menit dengan burst 10 nodelay
    location /threads {
        limit_req zone=threads_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Endpoint umum lainnya (Users, Authentications, dll.)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
